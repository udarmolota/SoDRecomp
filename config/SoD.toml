# XenonRecomp config for State of Decay (X360 XBLA, title 584111E8, XDK 2.0.21173), base
# default.xex (build of Jun 19 2013). Modeled on DAORecomp's config/DAO.toml.
# Run from this folder (XenonRecomp prefixes the config's directory to the paths below).
[main]
file_path = "../extracted/game/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "SoD_switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly (as DAO).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false


# longjmp restores f14.. from the jmp_buf and calls RtlUnwind (0x83608A20, .pdata).
# setjmp stores f14.. into it (0x83608750, no .pdata; starts with a hook-pointer check,
# 11 callers). Unlike DAO, setjmp sits before longjmp.
longjmp_address = 0x83608A20
setjmp_address = 0x83608750

# Data that sits between functions: exception-handler records (handler, scope data).
# .pdata has 164 functions with the exception flag: 94 __C_specific_handler (the
# xboxkrnl import thunk), 66 __CxxFrameHandler (CRT, 0x8361A3C8).
invalid_instructions = [
    { data = 0x00000000, size = 4 }, # padding
    { data = 0x8361A3C8, size = 8 }, # __CxxFrameHandler record
    { data = 0x83A8B730, size = 8 }, # __C_specific_handler record
]
